[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# API requests route to Netlify serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback: routes all browser paths and refreshes to index.html without 404s
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
